<h2 class="text-2xl font-bold ,t-5">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">Buscar gif por nombre, descripción o tags</h3>

<section class="flex flex-col gap-4">
    <input
     type="text"
     placeholder="Buscador Gifs"
     class="my-3 border border-gray-300 rounded-mg p-2"
     (keyup.enter)= "onSearch(txtSearch.value)"
     #txtSearch
    />
</section>

<section class="py-5">
    <app-gifs-list [gifs]= "gifs()"/>
</section>
